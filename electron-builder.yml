appId: com.devterm.app
productName: DevTerm
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
  # Trim debug symbols (node-pty's linux prebuilds are excluded per-platform, see win.files).
  - '!**/*.pdb'
  # Build artifacts and unused native/runtime packages that bloat every installer:
  # agent .js.map/.d.ts.map sources maps are never needed at runtime.
  - '!**/*.map'
  # STT runs entirely in the renderer on onnxruntime-web's wasm (served from
  # out/renderer/ort, copied by scripts/setup-native.mjs). @huggingface/transformers
  # hard-depends on onnxruntime-node (~208MB) and sharp/@img (~19MB), but neither
  # is ever imported by DevTerm code — the STT worker only touches the web bundle.
  - '!**/node_modules/onnxruntime-node/**'
  - '!**/node_modules/sharp/**'
  - '!**/node_modules/@img/**'
  # The onnxruntime-web dist wasm in node_modules is never loaded at runtime
  # (the worker points wasmPaths at /ort/); Vite has already inlined what it needs.
  - '!**/node_modules/onnxruntime-web/**'
  # Hashed ORT wasm asset emitted by transformers' `new URL(...)` fallback — only
  # referenced when wasmPaths is unset, and the STT worker always sets it to /ort/.
  - '!**/assets/ort-wasm-*.wasm'
asarUnpack:
  - '**/node_modules/node-pty/**'
  # Dedicated runtime for the built-in DevTerm Agent. Executables cannot run
  # from inside app.asar, so keep the platform-specific Node binary on disk.
  - '**/node_modules/node/bin/**'
  # The dedicated Node process cannot resolve JS or native dependencies from
  # Electron's virtual app.asar filesystem. Keep the bundled agent's complete
  # runtime dependency closure beside the executable.
  - '**/node_modules/@earendil-works/**'
  - '**/node_modules/@silvia-odwyer/**'
  - '**/node_modules/ansi-styles/**'
  - '**/node_modules/balanced-match/**'
  - '**/node_modules/brace-expansion/**'
  - '**/node_modules/chalk/**'
  - '**/node_modules/color-convert/**'
  - '**/node_modules/color-name/**'
  - '**/node_modules/cross-spawn/**'
  - '**/node_modules/diff/**'
  - '**/node_modules/fs.realpath/**'
  - '**/node_modules/glob/**'
  - '**/node_modules/has-flag/**'
  - '**/node_modules/highlight.js/**'
  - '**/node_modules/hosted-git-info/**'
  - '**/node_modules/ignore/**'
  - '**/node_modules/inflight/**'
  - '**/node_modules/inherits/**'
  - '**/node_modules/isexe/**'
  - '**/node_modules/jiti/**'
  - '**/node_modules/lru-cache/**'
  - '**/node_modules/minimatch/**'
  - '**/node_modules/once/**'
  - '**/node_modules/path-key/**'
  - '**/node_modules/proper-lockfile/**'
  - '**/node_modules/semver/**'
  - '**/node_modules/shebang-command/**'
  - '**/node_modules/shebang-regex/**'
  - '**/node_modules/supports-color/**'
  - '**/node_modules/typebox/**'
  - '**/node_modules/undici/**'
  - '**/node_modules/which/**'
  - '**/node_modules/wrappy/**'
  - '**/node_modules/yallist/**'
  - '**/node_modules/yaml/**'
  # onnxruntime-web's wasm for local speech-to-text. Large WASM binaries can fail
  # to instantiate from inside the asar archive over file://, so keep them on disk.
  - '**/ort/*.wasm'
win:
  icon: resources/icon.ico
  files:
    # Windows-only trim: node-pty's tarball ships linux-* prebuilds, useless on
    # Windows (we install the win32-x64 binary via scripts/setup-native.mjs).
    # Scoped to win so Linux builds keep their loadable prebuilds.
    - '!**/node_modules/node-pty/prebuilds/linux-*/**'
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}
  # Builds are unsigned; electron-updater would otherwise try to match a publisher cert.
  verifyUpdateCodeSignature: false
publish:
  - provider: github
    owner: AEmad99
    repo: devterm
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Force-close DevTerm.exe and install-dir orphans (agent node.exe) before
  # overwrite. Stock check only targets the main exe and aborts reinstalls.
  include: resources/installer.nsh

linux:
  icon: resources/icon.png
  target:
    - AppImage
  category: Utility
# node-pty is supplied as a prebuilt binary matching Electron's ABI; do not recompile.
npmRebuild: false
