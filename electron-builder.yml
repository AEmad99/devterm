appId: com.devterm.app
productName: DevTerm
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
  - resources/icon.ico
  - resources/icon.png
  # Trim debug symbols (node-pty's linux prebuilds are excluded per-platform, see win.files).
  - '!**/*.pdb'
  # Build artifacts and unused native/runtime packages that bloat every installer:
  # agent .js.map/.d.ts.map sources maps are never needed at runtime.
  - '!**/*.map'
  - '!**/*.d.ts'
  - '!**/*.d.mts'
  - '!**/*.d.cts'
  - '!**/*.test.ts'
  - '!**/*.spec.ts'
  - '!**/*.test.js'
  - '!**/*.spec.js'
  - '!**/tests/**'
  - '!**/test/**'
  - '!**/__tests__/**'
  # STT runs entirely in the renderer on onnxruntime-web's wasm (served from
  # out/renderer/ort, copied by scripts/setup-native.mjs). @huggingface/transformers
  # hard-depends on onnxruntime-node (~208MB) and sharp/@img (~19MB), but neither
  # is ever imported by DevTerm code — the STT worker only touches the web bundle.
  - '!**/node_modules/onnxruntime-node/**'
  - '!**/node_modules/sharp/**'
  - '!**/node_modules/@img/**'
  # The onnxruntime-web dist wasm in node_modules is never loaded at runtime
  # (the worker points wasmPaths at /ort/); Vite has already inlined what it needs.
  - '!**/node_modules/onnxruntime-web/**'
  # Hashed ORT wasm asset emitted by transformers' `new URL(...)` fallback — only
  # referenced when wasmPaths is unset, and the STT worker always sets it to /ort/.
  - '!**/assets/ort-wasm-*.wasm'
  - '!out/renderer/assets/*.wasm'
  # Whisper weights are never shipped. Dictation downloads a model from Hugging
  # Face the first time someone turns it on. The JS library is already inside
  # the worker bundle, so the npm package (and any .onnx files) stay out.
  - '!**/node_modules/@huggingface/**'
  - '!**/*.onnx'
  # VCS/sandbox metadata dirs: never ship, and prune them from the file walk
  # (some sandboxes deny even listing them, which fails the build on scandir).
  - '!.sl{,/**/*}'
  - '!.hg{,/**/*}'
  - '!.eden{,/**/*}'
  - '!.muse{,/**/*}'
  - '!.agents{,/**/*}'
# node-pty's npm `files` field omits build/ (Windows ConPTY addons live there
# after `npm run setup`). beforePack patches that field; afterPack fails the
# Windows build if conpty.node still is not in the unpacked output.
beforePack: scripts/before-pack.cjs
afterPack: scripts/after-pack.cjs
# Copy the logo as files (not a `to:` directory). extraResources land in
# process.resourcesPath; extraFiles land next to DevTerm.exe.
extraResources:
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png
extraFiles:
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png
asarUnpack:
  - '**/node_modules/node-pty/**'
  # Native addons cannot be dlopen'd from inside asar.
  - '**/*.node'
  # Dedicated runtime for the built-in DevTerm Agent. Executables cannot run
  # from inside app.asar, so keep the platform-specific Node binary on disk.
  - '**/node_modules/node/bin/**'
  # The dedicated Node process cannot resolve JS or native dependencies from
  # Electron's virtual app.asar filesystem. Keep the bundled agent's complete
  # runtime dependency closure beside the executable.
  - '**/node_modules/@earendil-works/**'
  # npm nests pi's closure under pi-coding-agent/node_modules (version conflicts
  # with DevTerm's own tree). Unpack the whole nested subtree depth-proofly;
  # unpacked matches land beside the agent binary where its resolver finds them.
  # (Replaces the 0.80-era flat per-package list, which missed nested-only deps
  # like partial-json and collided on hoisted duplicates.)
  - '**/node_modules/@earendil-works/pi-coding-agent/node_modules/**'
  # Hoisted shares: pi resolves these two to DevTerm's top-level copies (npm
  # hoists only when ranges are satisfied, so these versions are pi-blessed).
  - '**/node_modules/@modelcontextprotocol/sdk/**'
  - '**/node_modules/zod/**'
  # onnxruntime-web's wasm for local speech-to-text. Large WASM binaries can fail
  # to instantiate from inside the asar archive over file://, so keep them on disk.
  - '**/ort/*.wasm'
compression: maximum
win:
  icon: resources/icon.ico
  # Keep Chromium's English locale pack only. Page content does not need the
  # other ~50 locale paks (~37MB unpacked).
  electronLanguages:
    - en-US
  files:
    # A positive pattern is required. An ignore-only win.files list makes
    # electron-builder inject `**/*`, which packs the source tree, a second
    # copy of the dictation wasm, and the unused Vite asyncify wasm.
    - out/**/*
    - package.json
    - resources/icon.ico
    - resources/icon.png
    - '!out/renderer/assets/*.wasm'
    - '!**/*.onnx'
    - '!**/node_modules/@huggingface/**'
    # Windows-only trim: node-pty's tarball ships linux-* prebuilds, useless on
    # Windows (we install the win32-x64 binary via scripts/setup-native.mjs).
    # Scoped to win so Linux builds keep their loadable prebuilds.
    - '!**/node_modules/node-pty/prebuilds/linux-*/**'
    # esbuild's optional binary follows the machine that ran npm. A Windows
    # installer must not ship the Linux/macOS copies. The win32-x64 binary is
    # mirrored with the agent closure.
    - '!**/node_modules/@esbuild/linux-*/**'
    - '!**/node_modules/@esbuild/darwin-*/**'
    - '!**/node_modules/@esbuild/android-*/**'
    - '!**/node_modules/@esbuild/freebsd-*/**'
    - '!**/node_modules/@esbuild/netbsd-*/**'
    - '!**/node_modules/@esbuild/openbsd-*/**'
    - '!**/node_modules/@esbuild/sunos-*/**'
    - '!**/node_modules/@esbuild/aix-*/**'
    - '!**/node_modules/@esbuild/win32-ia32/**'
    - '!**/node_modules/@esbuild/win32-arm64/**'
    - '!.sl{,/**/*}'
    - '!.hg{,/**/*}'
    - '!.eden{,/**/*}'
    - '!.muse{,/**/*}'
    - '!.agents{,/**/*}'
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}
  # Builds are unsigned; electron-updater would otherwise try to match a publisher cert.
  verifyUpdateCodeSignature: false
publish:
  - provider: github
    owner: AEmad99
    repo: devterm
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  # Force-close DevTerm.exe and install-dir orphans (agent node.exe) before
  # overwrite. Stock check only targets the main exe and aborts reinstalls.
  include: resources/installer.nsh

linux:
  icon: resources/icon.png
  target:
    - AppImage
  category: Utility
# node-pty is supplied as a prebuilt binary matching Electron's ABI; do not recompile.
npmRebuild: false
